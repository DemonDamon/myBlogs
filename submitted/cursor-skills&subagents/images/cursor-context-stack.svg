<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <defs>
    <style>
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0b1220}
      .h{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-weight:700;fill:#0b1220}
      .box{rx:12;ry:12;stroke:#1f2937;stroke-width:1.5;fill:#ffffff}
      .mut{fill:#374151}
      .a{stroke:#111827;stroke-width:1.5;fill:none;marker-end:url(#m)}
      .chip{rx:10;ry:10;stroke:#94a3b8;stroke-width:1.2;fill:#f8fafc}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="912" height="472" class="box" fill="#f8fafc"/>
  <text x="48" y="60" class="h">Cursor Agent：上下文与执行栈（概念图）</text>
  <text x="48" y="84" class="t mut">目标：用尽量少的 token，把“长期规范 + 按需知识 + 可执行能力”拼装到一次推理里</text>

  <rect x="56" y="120" width="260" height="110" class="box"/>
  <text x="76" y="150" class="h">User Message</text>
  <text x="76" y="176" class="t">你的 prompt / @Mentions / 追加上下文</text>
  <text x="76" y="202" class="t mut">短期、每次会话变化</text>

  <rect x="350" y="120" width="260" height="110" class="box"/>
  <text x="370" y="150" class="h">Rules</text>
  <text x="370" y="176" class="t">系统级指令：风格、流程、约束</text>
  <text x="370" y="202" class="t mut">可按 globs / relevant / alwaysApply</text>

  <rect x="644" y="120" width="260" height="110" class="box"/>
  <text x="664" y="150" class="h">Skills</text>
  <text x="664" y="176" class="t">可版本化的工作流包（指令 + scripts）</text>
  <text x="664" y="202" class="t mut">默认自动选择，亦可禁用自动调用</text>

  <path class="a" d="M 316 175 L 350 175"/>
  <path class="a" d="M 610 175 L 644 175"/>

  <rect x="56" y="270" width="848" height="170" class="box"/>
  <text x="76" y="302" class="h">Execution</text>
  <text x="76" y="328" class="t">工具调用 / 终端 / 文件读写 / Web / MCP …</text>
  <text x="76" y="354" class="t mut">可被 Hooks 观察、拦截与改写；可委派给 Subagents 并行执行</text>

  <rect x="92" y="372" width="210" height="42" class="chip"/>
  <text x="112" y="399" class="t">Tools（Read / Write / …）</text>

  <rect x="322" y="372" width="210" height="42" class="chip"/>
  <text x="342" y="399" class="t">Subagents（Explore / Bash / Browser）</text>

  <rect x="552" y="372" width="150" height="42" class="chip"/>
  <text x="572" y="399" class="t">Hooks（事件钩子）</text>

  <rect x="722" y="372" width="150" height="42" class="chip"/>
  <text x="742" y="399" class="t">MCP（外部工具）</text>

  <path class="a" d="M 480 230 L 480 270"/>
  <text x="500" y="256" class="t mut">拼装后进入一次推理循环</text>
</svg>
