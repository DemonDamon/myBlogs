<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <defs>
    <style>
      .t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0b1220}
      .h{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;font-weight:700;fill:#0b1220}
      .box{rx:12;ry:12;stroke:#1f2937;stroke-width:1.5;fill:#ffffff}
      .pill{rx:16;ry:16;stroke:#0f172a;stroke-width:1.2;fill:#f8fafc}
      .line{stroke:#111827;stroke-width:2}
      .dot{fill:#111827}
      .mut{fill:#374151}
    </style>
  </defs>

  <rect x="24" y="24" width="912" height="472" class="box"/>
  <text x="48" y="60" class="h">Hooks：在 Agent 循环的关键节点“插桩 / 约束 / 自动化”</text>
  <text x="48" y="84" class="t mut">命令型 hook 通过 stdin/stdout JSON 通信；退出码 2 可阻止操作</text>

  <line x1="80" y1="220" x2="880" y2="220" class="line"/>

  <circle cx="120" cy="220" r="6" class="dot"/>
  <rect x="84" y="140" width="140" height="44" class="pill"/>
  <text x="98" y="168" class="t">sessionStart</text>

  <circle cx="270" cy="220" r="6" class="dot"/>
  <rect x="214" y="250" width="200" height="44" class="pill"/>
  <text x="228" y="278" class="t">beforeSubmitPrompt</text>

  <circle cx="430" cy="220" r="6" class="dot"/>
  <rect x="374" y="140" width="200" height="44" class="pill"/>
  <text x="388" y="168" class="t">preToolUse</text>

  <circle cx="560" cy="220" r="6" class="dot"/>
  <rect x="504" y="250" width="220" height="44" class="pill"/>
  <text x="518" y="278" class="t">postToolUse / Failure</text>

  <circle cx="700" cy="220" r="6" class="dot"/>
  <rect x="644" y="140" width="220" height="44" class="pill"/>
  <text x="658" y="168" class="t">afterFileEdit</text>

  <circle cx="840" cy="220" r="6" class="dot"/>
  <rect x="792" y="250" width="120" height="44" class="pill"/>
  <text x="806" y="278" class="t">stop</text>

  <text x="80" y="340" class="h">你能用 hooks 做什么？</text>
  <text x="80" y="368" class="t">- 编辑后自动格式化 / lint</text>
  <text x="80" y="392" class="t">- 敏感信息（PII/密钥）扫描与阻断</text>
  <text x="80" y="416" class="t">- 高风险操作门控（如 shell / SQL 写入）</text>
  <text x="80" y="440" class="t">- 子代理生命周期审计（subagentStart/Stop）</text>
</svg>
